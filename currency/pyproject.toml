[project]
name = "currency"
version = "1.0.0"
description = "Currency exchange MCP server"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
]

[project.scripts]
currency = "currency:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
